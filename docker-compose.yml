services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/storage:/app/storage  # persist the vector index across restarts

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
